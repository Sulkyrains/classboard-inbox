plugins {
    id 'com.android.application'
}

android {
    namespace "cn.classboard.inbox"
    compileSdk 36

    defaultConfig {
        applicationId "cn.classboard.inbox"
        minSdk 23
        targetSdk 36
        versionCode 7
        versionName "2.0.4"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
